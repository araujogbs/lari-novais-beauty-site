<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Lari Novais Beauty</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#c2537a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem;
      font-family: Inter, sans-serif; color: #2c2c2c; text-align: center;
      background: linear-gradient(170deg, #fbe1e8 0%, #fdf0f3 55%, #fff 100%);
    }
    .card { max-width: 30rem; padding: 3rem 2rem; border: 1px solid rgba(194, 83, 122, 0.45); outline: 1px solid rgba(194, 83, 122, 0.2); outline-offset: -8px; background: rgba(255, 255, 255, 0.6); }
    .star { width: 14px; height: 14px; margin: 0 auto 1.25rem; background: #c2537a; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
    .code { font-size: 0.75rem; letter-spacing: 0.3em; color: #c2537a; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 2.4rem; line-height: 1.1; margin: 0.75rem 0 1rem; }
    h1 em { color: #9e3a5e; font-weight: 300; }
    p { color: #6b6b6b; font-weight: 300; line-height: 1.7; }
    a.btn { display: inline-block; margin-top: 2rem; padding: 0.9rem 2rem; border-radius: 6px; background: #c2537a; color: #fff; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; }
    a.btn:hover { background: #9e3a5e; }
  </style>
</head>
<body>
  <main class="card">
    <div class="star" aria-hidden="true"></div>
    <div class="code">ERRO 404</div>
    <h1>Esta página <em>não existe</em></h1>
    <p>O endereço pode ter sido digitado errado ou a página mudou de lugar. Tudo o que você procura está no site principal.</p>
    <a class="btn" href="/">Voltar para o site</a>
  </main>
</body>
</html>
